name: Apply REFLEX Evidence Patch

on:
  push:
    branches:
      - fix/research-evidence-labels

permissions:
  contents: write

jobs:
  apply-patch:
    if: "${{ github.event.head_commit.message == 'chore: rerun evidence patch applicator' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .reflex-patch/part-* > /tmp/reflex-evidence.patch.gz.b64
          base64 --decode /tmp/reflex-evidence.patch.gz.b64 > /tmp/reflex-evidence.patch.gz
          echo '8b222bb9d9fe0d8cad3ffbf0ccaa304e44dd39129a7d5eea84f943bbf3f23283  /tmp/reflex-evidence.patch.gz' | sha256sum -c -
          gzip -dc /tmp/reflex-evidence.patch.gz > /tmp/reflex-evidence.patch
          echo '2b18d83270fc86321639ebfd1958241e8b89ba41af527fdf5d2646b0df23ef4d  /tmp/reflex-evidence.patch' | sha256sum -c -
          git apply --check /tmp/reflex-evidence.patch

      - name: Apply evidence corrections
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/reflex-evidence.patch
          git diff --check

      - name: Run Node tests
        run: npm test

      - name: Commit corrected files and remove temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .reflex-patch
          rm -f .github/workflows/apply-reflex-evidence.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: correct research evidence labels and verification claims'
          git push origin HEAD:fix/research-evidence-labels
